name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/cybersecurity-networking-course-188ppl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Note: `enablement: true` is deliberately not used. Creating a Pages site
      # requires repo-admin rights that GITHUB_TOKEN is not granted, so it always
      # fails with "Resource not accessible by integration". Pages must be turned
      # on once by hand: Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      # Served verbatim — the Actions deploy path does not run Jekyll,
      # so no .nojekyll file is needed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
